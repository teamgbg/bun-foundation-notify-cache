# @system codegen
# @status generated
# @edit change codegen_output 'all-repos-lefthook', then regenerate
#
# Lefthook hook orchestration — the shared shape every repo carries.
# Transports live ONCE in the guard-hook-transport repo (sibling of every
# repo under the lane's repo root); this file only wires Lefthook to them.
# Lefthook does natively what the old per-repo layer hand-wrote: install
# (assert_lefthook_installed), file sets (scripts fire unconditionally —
# commands skip on tag-only pushes), skips (skip: run:), failure text
# (fail_text).

assert_lefthook_installed: true
min_version: 2.1.14

# Co-Pane commit trailers are stamped by the scala-tools commit verb itself
# (commit_claim_gate -> commit_co_pane, probe 2026-09-27: trailer lands with
# no lefthook prepare-commit-msg wired) — this file no longer duplicates it.

pre-commit:
  commands:
    scala-guard:
      run: bash ../guard-hook-transport/hooks/pre-commit
      # Master-switch skip. POSIX sh ONLY: lefthook evaluates skip run-strings
      # with /bin/sh, where the bash herestring (<<<) is a syntax error that
      # silently disables the WHOLE clause (measured 2026-09-27: the
      # herestring form never skipped — the defect the pre-commit arm of the
      # old generated config carried; every commit paid the DB read).
      skip:
        - run: 'cache="${XDG_RUNTIME_DIR:-/tmp}/scala-guard-switch-state"; if [ -f "$cache" ]; then value="$(cat "$cache")"; if [ "$value" = "off" ] || printf "%s\n" "$value" | grep -qx "pre-commit=0"; then exit 0; fi; fi; scala-tools master-switch is-off pre-commit'
      fail_text: scala-guard pre-commit transport refused this commit — see the output above

pre-push:
  parallel: false
  scripts:
    "scala-guard":
      # A lefthook SCRIPT (not a command) so it fires UNCONDITIONALLY — even
      # on a tag-only publish push, where a command is skipped ("no matching
      # push files"; measured 2026-09-27). The body lives in the shared
      # transport repo, reached through the generated stub.
      runner: bash
      skip:
        - run: 'cache="${XDG_RUNTIME_DIR:-/tmp}/scala-guard-switch-state"; if [ -f "$cache" ]; then value="$(cat "$cache")"; if [ "$value" = "off" ] || printf "%s\n" "$value" | grep -qx "pre-push=0"; then exit 0; fi; fi; scala-tools master-switch is-off pre-push'
      fail_text: scala-guard pre-push refused this push — see the output above
